{{- if and (not .Values.twigex.externalSecret) (not .Values.twigex.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-twigex
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
{{- if .Values.twigex.admin.enabled }}
  TWIGEX_ADMIN_PASSWORD:       {{ .Values.twigex.admin.password | required "twigex.admin.password is required" | quote }}
{{- end }}
  TWIGEX_SERVER_ENCRYPT_KEY:   {{ .Values.twigex.server.encryptKey | quote }}
  TWIGEX_DB_PASSWORD:          {{ include "twigex.mariadbPasswordPlain" . | quote }}
  TWIGEX_REDIS_PASSWORD:       {{ .Values.redis.auth.password | quote }}
  TWIGEX_STORAGE_ACCESS_KEY:   {{ .Values.twigex.storage.s3.accessKey | quote }}
  TWIGEX_STORAGE_SECRET_KEY:   {{ .Values.twigex.storage.s3.secretKey | quote }}
  TWIGEX_SMTP_PASSWORD:        {{ .Values.twigex.smtp.password | quote }}
  TWIGEX_OFFICE_SECRET:        {{ .Values.twigex.office.secret | quote }}
  TWIGEX_CHANNEL_SECRET:       {{ .Values.twigex.channel.secret | quote }}
  TWIGEX_LDAP_BIND_PASSWORD:   {{ .Values.twigex.ldap.bindPassword | quote }}
{{- end }}
