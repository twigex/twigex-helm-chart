{{- if not .Values.twigex.externalSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-twigex
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- if .Values.twigex.existingSecret.name }}
    "twigex.twingex.io/source-secret": {{ .Values.twigex.existingSecret.name | quote }}
    {{- end }}
type: Opaque
stringData:
{{- $src := "" -}}
{{- if .Values.twigex.existingSecret.name -}}
  {{- $src = "set" -}}
{{- end -}}
{{- if not $src }}
  COSPACE_ADMIN_PASSWORD:       {{ .Values.twigex.admin.password | required "twigex.admin.password is required" | quote }}
  COSPACE_SERVER_ENCRYPT_KEY:   {{ .Values.twigex.server.encryptKey | quote }}
  COSPACE_DB_PASSWORD:          {{ include "twigex.mariadbPasswordPlain" . | quote }}
  COSPACE_REDIS_PASSWORD:       {{ .Values.redis.auth.password | quote }}
  COSPACE_STORAGE_ACCESS_KEY:   {{ .Values.twigex.storage.s3.accessKey | quote }}
  COSPACE_STORAGE_SECRET_KEY:   {{ .Values.twigex.storage.s3.secretKey | quote }}
  COSPACE_SMTP_PASSWORD:        {{ .Values.twigex.smtp.password | quote }}
  COSPACE_OFFICE_SECRET:        {{ .Values.twigex.office.secret | quote }}
  COSPACE_CHANNEL_SECRET:       {{ .Values.twigex.channel.secret | quote }}
  COSPACE_GITEA_CLIENT_SECRET:  {{ .Values.twigex.gitea.clientSecret | quote }}
  COSPACE_LDAP_BIND_PASSWORD:   {{ .Values.twigex.ldap.bindPassword | quote }}
{{- else }}
  COSPACE_ADMIN_PASSWORD: ""
  COSPACE_SERVER_ENCRYPT_KEY: ""
  COSPACE_DB_PASSWORD: ""
  COSPACE_REDIS_PASSWORD: ""
  COSPACE_STORAGE_ACCESS_KEY: ""
  COSPACE_STORAGE_SECRET_KEY: ""
  COSPACE_SMTP_PASSWORD: ""
  COSPACE_OFFICE_SECRET: ""
  COSPACE_CHANNEL_SECRET: ""
  COSPACE_GITEA_CLIENT_SECRET: ""
  COSPACE_LDAP_BIND_PASSWORD: ""
{{- end }}
{{- end }}
