{{- if .Values.twigex.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-twigex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "twigex.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
# Grants the twigex ServiceAccount permission to manage per-workspace
# ConfigMaps. Scope is intentionally narrow: the next twigex release
# only needs configmaps. Widen when future releases require it.
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
