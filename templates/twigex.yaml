{{- include "twigex.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-twigex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "twigex.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.twigex.replicas }}
  strategy:
    type: {{ .Values.twigex.strategy }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-twigex
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-twigex
        {{- with .Values.twigex.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.twigex.pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.twigex.serviceAccount.create }}
      serviceAccountName: {{ .Values.twigex.serviceAccount.name | default (printf "%s-twigex" .Release.Name) | quote }}
      {{- end }}
      {{- with .Values.twigex.serviceAccount.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.twigex.pod.priorityClassName }}
      priorityClassName: {{ .Values.twigex.pod.priorityClassName | quote }}
      {{- end }}
      {{- with .Values.twigex.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.twigex.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.twigex.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.twigex.pod.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.twigex.pod.securityContext }}
      securityContext:
        {{- toYaml .Values.twigex.pod.securityContext | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.twigex.pod.terminationGracePeriodSeconds }}
      containers:
        - name: twigex
          image: "{{ .Values.twigex.image.repository }}:{{ .Values.twigex.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.twigex.image.pullPolicy }}
          {{- if .Values.twigex.pod.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.twigex.pod.containerSecurityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.twigex.probes.enabled }}
          livenessProbe:
            tcpSocket: {port: {{ .Values.twigex.server.port }}}
            initialDelaySeconds: {{ .Values.twigex.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.twigex.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.twigex.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.twigex.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket: {port: {{ .Values.twigex.server.port }}}
            initialDelaySeconds: {{ .Values.twigex.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.twigex.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.twigex.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.twigex.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.twigex.resources | nindent 12 }}
          volumeMounts:
            - name: shared-pvc
              mountPath: /app/data
            - name: shared-pvc
              mountPath: /app/config
          env:
            - name: TWIGEX_ADMIN_NAME
              value: {{ .Values.twigex.admin.name | quote }}
            - name: TWIGEX_ADMIN_LASTNAME
              value: {{ .Values.twigex.admin.lastName | quote }}
            - name: TWIGEX_ADMIN_USERNAME
              value: {{ .Values.twigex.admin.username | quote }}
            - name: TWIGEX_ADMIN_EMAIL
              value: {{ .Values.twigex.admin.email | quote }}
            {{- if .Values.twigex.admin.enabled }}
            - name: TWIGEX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_ADMIN_PASSWORD | quote }}
            {{- end }}
            - name: TWIGEX_SERVER_SITE_URL
              value: {{ printf "https://%s" .Values.domain | quote }}
            - name: TWIGEX_SERVER_PORT
              value: {{ .Values.twigex.server.port | quote }}
            - name: TWIGEX_SERVER_DEFAULT_LOCALE
              value: {{ .Values.twigex.server.defaultLocale | quote }}
            - name: TWIGEX_SERVER_SESSION_LENGTH_DAYS
              value: {{ .Values.twigex.server.sessionLengthDays | quote }}
            - name: TWIGEX_SERVER_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_SERVER_ENCRYPT_KEY | quote }}
            - name: TWIGEX_SERVER_TLS_CERT_FILE
              value: {{ .Values.twigex.server.tlsCertFile | quote }}
            - name: TWIGEX_SERVER_TLS_KEY_FILE
              value: {{ .Values.twigex.server.tlsKeyFile | quote }}
            {{- with .Values.twigex.server.trustedProxies }}
            - name: TWIGEX_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.twigex.server.trustedProxyHeaders }}
            - name: TWIGEX_TRUSTED_PROXY_HEADERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.twigex.server.maxPublicUploadSize }}
            - name: TWIGEX_MAX_PUBLIC_UPLOAD_SIZE
              value: {{ . | quote }}
            {{- end }}
            - name: TWIGEX_DB_HOST
              value: {{ if eq .Values.mariadb.mode "external" }}{{ .Values.twigex.db.host | quote }}{{ else }}{{ printf "%s-mariadb" .Release.Name | quote }}{{ end }}
            - name: TWIGEX_DB_PORT
              value: {{ .Values.twigex.db.port | quote }}
            - name: TWIGEX_DB_USER
              value: {{ .Values.twigex.db.user | quote }}
            - name: TWIGEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_DB_PASSWORD | quote }}
            - name: TWIGEX_DB_NAME
              value: {{ .Values.twigex.db.name | quote }}
            - name: TWIGEX_DB_DRIVER
              value: {{ .Values.twigex.db.driver | quote }}
            - name: TWIGEX_DB_READ_TIMEOUT
              value: {{ .Values.twigex.db.readTimeout | quote }}
            - name: TWIGEX_DB_WRITE_TIMEOUT
              value: {{ .Values.twigex.db.writeTimeout | quote }}
            - name: TWIGEX_DB_MAX_OPEN_CONNS
              value: {{ .Values.twigex.db.maxOpenConns | quote }}
            - name: TWIGEX_DB_MAX_IDLE_CONNS
              value: {{ .Values.twigex.db.maxIdleConns | quote }}
            - name: TWIGEX_DB_CONN_MAX_LIFETIME_MINUTES
              value: {{ .Values.twigex.db.connMaxLifetimeMinutes | quote }}
            - name: TWIGEX_DB_CONN_MAX_IDLE_TIME_MINUTES
              value: {{ .Values.twigex.db.connMaxIdleTimeMinutes | quote }}
            - name: TWIGEX_DB_QUERY_TIMEOUT
              value: {{ .Values.twigex.db.queryTimeout | quote }}
            - name: TWIGEX_REDIS_ADDRESS
              value: {{ printf "%s-redis-master:6379" .Release.Name | quote }}
            - name: TWIGEX_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_REDIS_PASSWORD | quote }}
            - name: TWIGEX_STORAGE_TYPE
              value: {{ .Values.twigex.storage.type | quote }}
            {{- if or (eq .Values.twigex.storage.type "s3") (eq .Values.twigex.storage.type "s3compat") }}
            - name: TWIGEX_STORAGE_NAME
              value: {{ .Values.twigex.storage.s3.name | quote }}
            - name: TWIGEX_STORAGE_ENDPOINT
              value: {{ .Values.twigex.storage.s3.endpoint | quote }}
            - name: TWIGEX_STORAGE_BUCKET
              value: {{ .Values.twigex.storage.s3.bucket | quote }}
            - name: TWIGEX_STORAGE_SSL
              value: {{ .Values.twigex.storage.s3.ssl | quote }}
            - name: TWIGEX_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_STORAGE_ACCESS_KEY | quote }}
            - name: TWIGEX_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_STORAGE_SECRET_KEY | quote }}
            {{- else }}
            - name: TWIGEX_STORAGE_NAME
              value: {{ .Values.twigex.storage.local.name | quote }}
            - name: TWIGEX_STORAGE_ENDPOINT
              value: ""
            - name: TWIGEX_STORAGE_ACCESS_KEY
              value: ""
            - name: TWIGEX_STORAGE_SECRET_KEY
              value: ""
            - name: TWIGEX_STORAGE_BUCKET
              value: ""
            - name: TWIGEX_STORAGE_SSL
              value: "false"
            {{- end }}
            {{- if .Values.twigex.smtp.host }}
            - name: TWIGEX_SMTP_HOST
              value: {{ .Values.twigex.smtp.host | quote }}
            - name: TWIGEX_SMTP_PORT
              value: {{ .Values.twigex.smtp.port | quote }}
            - name: TWIGEX_SMTP_USERNAME
              value: {{ .Values.twigex.smtp.username | quote }}
            - name: TWIGEX_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_SMTP_PASSWORD | quote }}
            - name: TWIGEX_SMTP_SECURITY
              value: {{ .Values.twigex.smtp.security | quote }}
            - name: TWIGEX_SMTP_AUTH_ENABLED
              value: {{ .Values.twigex.smtp.authEnabled | quote }}
            - name: TWIGEX_SMTP_FROM_ADDRESS
              value: {{ .Values.twigex.smtp.fromAddress | quote }}
            - name: TWIGEX_SMTP_FROM_NAME
              value: {{ .Values.twigex.smtp.fromName | quote }}
            - name: TWIGEX_SMTP_REPLY_TO
              value: {{ .Values.twigex.smtp.replyTo | quote }}
            {{- end }}
            {{- if .Values.twigex.office.host }}
            - name: TWIGEX_OFFICE_ENABLE
              value: {{ .Values.twigex.office.enabled | quote }}
            - name: TWIGEX_OFFICE_TYPE
              value: {{ .Values.twigex.office.type | quote }}
            - name: TWIGEX_OFFICE_HOST
              value: {{ .Values.twigex.office.host | quote }}
            - name: TWIGEX_OFFICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_OFFICE_SECRET | quote }}
            {{- end }}
            {{- if .Values.twigex.channel.host }}
            - name: TWIGEX_CHANNEL_ENABLED
              value: {{ .Values.twigex.channel.enabled | quote }}
            - name: TWIGEX_CHANNEL_HOST
              value: {{ .Values.twigex.channel.host | quote }}
            - name: TWIGEX_CHANNEL_KEY
              value: {{ .Values.twigex.channel.key | quote }}
            - name: TWIGEX_CHANNEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_CHANNEL_SECRET | quote }}
            {{- end }}
            {{- if .Values.twigex.channel.linkPreviews }}
            - name: TWIGEX_CHANNEL_LINK_PREVIEWS
              value: {{ .Values.twigex.channel.linkPreviews | quote }}
            {{- end }}
            {{- if .Values.twigex.channel.gif.enabled }}
            - name: TWIGEX_CHANNEL_GIF_ENABLED
              value: {{ .Values.twigex.channel.gif.enabled | quote }}
            - name: TWIGEX_CHANNEL_GIF_API_KEY
              value: {{ .Values.twigex.channel.gif.apiKey | quote }}
            {{- end }}
            {{- if .Values.twigex.ldap.host }}
            - name: TWIGEX_LDAP_ENABLED
              value: {{ .Values.twigex.ldap.enabled | quote }}
            - name: TWIGEX_LDAP_HOST
              value: {{ .Values.twigex.ldap.host | quote }}
            - name: TWIGEX_LDAP_PORT
              value: {{ .Values.twigex.ldap.port | quote }}
            - name: TWIGEX_LDAP_BASE_DN
              value: {{ .Values.twigex.ldap.baseDN | quote }}
            - name: TWIGEX_LDAP_BIND_DN
              value: {{ .Values.twigex.ldap.bindDN | quote }}
            - name: TWIGEX_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twigex.secretName" . | quote }}
                  key: {{ .Values.twigex.existingSecret.keys.TWIGEX_LDAP_BIND_PASSWORD | quote }}
            - name: TWIGEX_LDAP_CONNECTION_SECURITY
              value: {{ .Values.twigex.ldap.connectionSecurity | quote }}
            - name: TWIGEX_LDAP_CA_CERT
              value: {{ .Values.twigex.ldap.caCert | quote }}
            - name: TWIGEX_LDAP_INSECURE_SKIP_VERIFY
              value: {{ .Values.twigex.ldap.insecureSkipVerify | quote }}
            - name: TWIGEX_LDAP_TIMEOUT_SECONDS
              value: {{ .Values.twigex.ldap.timeoutSeconds | quote }}
            - name: TWIGEX_LDAP_USER_FILTER
              value: {{ .Values.twigex.ldap.userFilter | quote }}
            - name: TWIGEX_LDAP_USERNAME_ATTR
              value: {{ .Values.twigex.ldap.usernameAttr | quote }}
            - name: TWIGEX_LDAP_ID_ATTR
              value: {{ .Values.twigex.ldap.idAttr | quote }}
            - name: TWIGEX_LDAP_FIRST_NAME_ATTR
              value: {{ .Values.twigex.ldap.firstNameAttr | quote }}
            - name: TWIGEX_LDAP_LAST_NAME_ATTR
              value: {{ .Values.twigex.ldap.lastNameAttr | quote }}
            - name: TWIGEX_LDAP_EMAIL_ATTR
              value: {{ .Values.twigex.ldap.emailAttr | quote }}
            - name: TWIGEX_LDAP_SYNC_ENABLED
              value: {{ .Values.twigex.ldap.syncEnabled | quote }}
            - name: TWIGEX_LDAP_SYNC_INTERVAL_MINUTES
              value: {{ .Values.twigex.ldap.syncIntervalMinutes | quote }}
            - name: TWIGEX_LDAP_SYNC_MAX_DEACTIVATE_PERCENT
              value: {{ .Values.twigex.ldap.syncMaxDeactivatePercent | quote }}
            - name: TWIGEX_LDAP_ALLOWED_GROUPS
              value: {{ .Values.twigex.ldap.allowedGroups | quote }}
            {{- end }}
            - name: TWIGEX_LICENSE
              value: {{ .Values.twigex.license | quote }}
            {{- if .Values.cube.enabled }}
            - name: TWIGEX_COLLIMATO_CUBE_API_URL
              value: {{ printf "http://%s-cube-api:%d" .Release.Name (int .Values.cube.api.service.port) | quote }}
            - name: TWIGEX_COLLIMATO_CUBE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.fullSecretName" . | quote }}
                  key: {{ .Values.cube.existingSecret.keys.CUBEJS_API_SECRET | quote }}
            - name: TWIGEX_COLLIMATO_CUBE_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.fullSecretName" . | quote }}
                  key: {{ .Values.cube.existingSecret.keys.CUBE_CALLBACK_SECRET | quote }}
            {{- end }}
            {{- range $k, $v := .Values.twigex.config }}
            - name: TWIGEX_{{ $k | upper | replace "-" "_" }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $ref := .Values.twigex.configFromSecrets }}
            - name: TWIGEX_{{ $k | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name | quote }}
                  key: {{ $ref.key | quote }}
            {{- end }}
      volumes:
        - name: shared-pvc
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-twigex-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "twigex.commonLabels" . | nindent 4 }}
  {{- with .Values.twigex.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.twigex.service.type }}
  {{- if and (eq .Values.twigex.service.type "NodePort") .Values.twigex.service.nodePort }}
  nodePort: {{ .Values.twigex.service.nodePort | int }}
  {{- end }}
  {{- with .Values.twigex.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    app: {{ .Release.Name }}-twigex
  ports:
    - name: http
      port: {{ .Values.twigex.service.port | int }}
      targetPort: {{ .Values.twigex.service.targetPort | int }}
