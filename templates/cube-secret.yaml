{{- include "twigex.validate" . -}}
{{- if and .Values.cube.enabled (not .Values.cube.existingSecret.name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube.fullSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CUBEJS_API_SECRET:    {{ .Values.cube.apiSecret | quote }}
  CUBE_CALLBACK_SECRET: {{ .Values.cube.callbackSecret | quote }}
{{- end -}}
