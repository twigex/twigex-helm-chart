{{- include "twigex.validate" . -}}
{{- if .Values.cube.enabled -}}
{{- $src := .Values.cube.existingSecret.name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube.fullSecretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # When cube.existingSecret.name is set, the chart-managed Secret is a shell
  # that exists so the cube Pod can reference it; the actual values come from
  # the user-managed Secret. Empty placeholders make that obvious.
  CUBEJS_API_SECRET:    {{ if $src }}{{ "" | quote }}{{ else }}{{ .Values.cube.apiSecret | quote }}{{ end }}
  CUBE_CALLBACK_SECRET: {{ if $src }}{{ "" | quote }}{{ else }}{{ .Values.cube.callbackSecret | quote }}{{ end }}
{{- end -}}
