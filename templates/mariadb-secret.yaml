{{- if and (not .Values.mariadb.externalSecret) (eq .Values.mariadb.mode "embedded") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mariadb
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  mariadb-password: {{ include "twigex.mariadbPassword" . }}
  mariadb-root-password: {{ include "twigex.mariadbRootPassword" . }}
{{- end -}}
