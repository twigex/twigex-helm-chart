{{- if .Values.twigex.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.twigex.serviceAccount.name | default (printf "%s-twigex" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "twigex.commonLabels" . | nindent 4 }}
  {{- with .Values.twigex.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.twigex.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end -}}
