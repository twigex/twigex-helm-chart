{{- if .Values.twigex.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-twigex
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "twigex.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
subjects:
  - kind: ServiceAccount
    name: {{ .Values.twigex.serviceAccount.name | default (printf "%s-twigex" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-twigex
{{- end }}
