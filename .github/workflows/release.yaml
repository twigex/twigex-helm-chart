name: Release (publish OCI chart)

# Publishes the chart to GHCR when a version tag is pushed (v0.0.36 -> chart
# version 0.0.36). Chart version and tag must agree; CI fails otherwise.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Guard — Chart.yaml version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART_VERSION="$(awk '/^version:/ {print $2}' Chart.yaml)"
          if [ "$TAG" != "$CHART_VERSION" ]; then
            echo "Tag v$TAG but Chart.yaml version is $CHART_VERSION — refusing to publish." >&2
            exit 1
          fi
          echo "Publishing chart version $CHART_VERSION"

      - name: Lint
        run: helm lint .

      - name: Render smoke test
        run: |
          helm template ci . \
            --set domain=example.com \
            --set twigex.admin.password=ci-password \
            --set twigex.server.encryptKey=000102030405060708090a0b0c0d0e0f \
            --set redis.auth.password=ci-redis \
            --set mariadb.password=ci-db \
            --set mariadb.rootPassword=ci-root > /dev/null

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        run: |
          helm dependency update .
          helm package .
          helm push twigex-*.tgz oci://ghcr.io/twigex/helm-charts
